<!DOCTYPE html>
<html>
    <head>
        <title>LibraryManagementsystem</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Library Management System</h1>

            <script src="script.js"></script>
        </div>
    </body>
